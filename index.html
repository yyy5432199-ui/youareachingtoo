<script>
    // --- 核心变量 ---
    let energy = 100;
    let tool = 'needle';
    let particles = [];
    let adTimerInstance = null;
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    const appContainer = document.getElementById('app-container');
    const staminaFill = document.getElementById('stamina-fill');
    // 新增：记录上一次生成的 AI 回复（放在其它全局变量附近）
    let lastAiReplyText = null;

    // 设备像素比缩放 & 画布适配到容器（更清晰的粒子）
    function resizeCanvasToContainer() {
        const rect = appContainer.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', () => {
        // debounce by small timeout if needed
        resizeCanvasToContainer();
    });
    resizeCanvasToContainer();

    // --- 尖端 Web Audio API 动态合成引擎 ---
    const AudioEngine = {
        ctx: null,
        mainGain: null,
        delayNode: null,
        delayFeedback: null,
        droneOscs: [],

        init() {
            if (this.ctx) return Promise.resolve();
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                // 延迟与回声链
                this.delayNode = this.ctx.createDelay(1.0);
                this.delayFeedback = this.ctx.createGain();
                this.delayNode.delayTime.setValueAtTime(0.4, this.ctx.currentTime);
                this.delayFeedback.gain.setValueAtTime(0.28, this.ctx.currentTime);

                this.mainGain = this.ctx.createGain();
                this.mainGain.gain.setValueAtTime(0.5, this.ctx.currentTime);

                // 连接反馈环路
                this.delayNode.connect(this.delayFeedback);
                this.delayFeedback.connect(this.delayNode);

                // 合并到输出
                this.mainGain.connect(this.ctx.destination);
                this.delayNode.connect(this.mainGain);

                // 启动声景
                this.startDrone();
                this.startWind();
                this.startBgm();
            } catch (err) {
                console.warn('Audio init failed', err);
            }
            return Promise.resolve();
        },

        createNoiseBuffer() {
            const bufferSize = Math.floor(this.ctx.sampleRate * 1.5); // 1.5s
            const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            return noiseBuffer;
        },

        startDrone() {
            if (!this.ctx) return;
            const osc1 = this.ctx.createOscillator();
            const osc2 = this.ctx.createOscillator();
            const filter = this.ctx.createBiquadFilter();
            const droneGain = this.ctx.createGain();

            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(48, this.ctx.currentTime);

            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(49, this.ctx.currentTime);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(90, this.ctx.currentTime);

            droneGain.gain.setValueAtTime(0.10, this.ctx.currentTime);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(droneGain);
            droneGain.connect(this.mainGain);

            osc1.start();
            osc2.start();
            this.droneOscs.push(osc1, osc2);
        },

        startWind() {
            if (!this.ctx) return;
            const noiseNode = this.ctx.createBufferSource();
            noiseNode.buffer = this.createNoiseBuffer();
            noiseNode.loop = true;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.Q.setValueAtTime(3.5, this.ctx.currentTime);

            const windGain = this.ctx.createGain();
            windGain.gain.setValueAtTime(0.02, this.ctx.currentTime);

            noiseNode.connect(filter);
            filter.connect(windGain);
            windGain.connect(this.mainGain);

            noiseNode.start();

            const lfo = this.ctx.createOscillator();
            lfo.frequency.setValueAtTime(0.06, this.ctx.currentTime);
            const lfoGain = this.ctx.createGain();
            lfoGain.gain.setValueAtTime(150, this.ctx.currentTime);

            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            filter.frequency.setValueAtTime(350, this.ctx.currentTime);

            lfo.start();
        },

        startBgm() {
            if (!this.ctx) return;
            const scale = [261.6, 277.2, 311.1, 349.2, 369.9, 415.3, 493.9, 523.3];

            const playNextNote = () => {
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                const nextDelay = Math.random() > 0.88 ? 2.4 : 1.2 + Math.random() * 0.6;

                const osc = this.ctx.createOscillator();
                const pluckGain = this.ctx.createGain();

                const vibrato = this.ctx.createOscillator();
                const vibratoGain = this.ctx.createGain();
                vibrato.frequency.setValueAtTime(5 + Math.random() * 3, now);
                vibratoGain.gain.setValueAtTime(4 + Math.random() * 4, now);
                vibrato.connect(vibratoGain);
                vibratoGain.connect(osc.frequency);
                vibrato.start(now);
                vibrato.stop(now + 2.5);

                osc.type = 'sine';
                const baseNote = scale[Math.floor(Math.random() * scale.length)];
                osc.frequency.setValueAtTime(baseNote, now);

                pluckGain.gain.setValueAtTime(0.0, now);
                pluckGain.gain.linearRampToValueAtTime(0.05, now + 0.01);
                pluckGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

                osc.connect(pluckGain);
                pluckGain.connect(this.mainGain);
                pluckGain.connect(this.delayNode);

                osc.start(now);
                osc.stop(now + 2.0);

                setTimeout(playNextNote, nextDelay * 1000);
            };

            setTimeout(playNextNote, 1000);
        },

        playHit(type) {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            if (type === 'needle') {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1800, now);
                osc.frequency.exponentialRampToValueAtTime(250, now + 0.12);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain).connect(this.mainGain);
                osc.start(now); osc.stop(now + 0.15);

            } else if (type === 'punch') {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(130, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.22);

                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                const noise = this.ctx.createBufferSource();
                noise.buffer = this.createNoiseBuffer();
                const noiseFilter = this.ctx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.setValueAtTime(150, now);
                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.22, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                noise.connect(noiseFilter).connect(noiseGain).connect(this.mainGain);
                osc.connect(gain).connect(this.mainGain);

                osc.start(now); osc.stop(now + 0.25);
                noise.start(now); noise.stop(now + 0.1);

            } else if (type === 'brick') {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.35);

                gain.gain.setValueAtTime(0.65, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                const crackle = this.ctx.createBufferSource();
                crackle.buffer = this.createNoiseBuffer();
                const crackleFilter = this.ctx.createBiquadFilter();
                crackleFilter.type = 'bandpass';
                crackleFilter.frequency.setValueAtTime(600, now);
                crackleFilter.Q.setValueAtTime(1.5, now);

                const crackleGain = this.ctx.createGain();
                crackleGain.gain.setValueAtTime(0.35, now);
                crackleGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                crackle.connect(crackleFilter).connect(crackleGain).connect(this.mainGain);
                crackleGain.connect(this.delayNode);

                osc.connect(gain).connect(this.mainGain);

                osc.start(now); osc.stop(now + 0.4);
                crackle.start(now); crackle.stop(now + 0.25);
            }
        },

        playTap() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc.connect(gain).connect(this.mainGain);
            osc.start(now); osc.stop(now + 0.1);
        },

        playResonance() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc1 = this.ctx.createOscillator();
            const osc2 = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc1.type = 'sine';
            osc2.type = 'sine';
            osc1.frequency.setValueAtTime(523.25, now);
            osc2.frequency.setValueAtTime(783.99, now);

            gain.gain.setValueAtTime(0.0, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(this.mainGain);
            gain.connect(this.delayNode);

            osc1.start(now); osc1.stop(now + 1.6);
            osc2.start(now); osc2.stop(now + 1.6);
        },

        playWhisper() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const noise = this.ctx.createBufferSource();
            noise.buffer = this.createNoiseBuffer();

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(900, now);
            filter.frequency.exponentialRampToValueAtTime(350, now + 0.4);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

            noise.connect(filter).connect(gain).connect(this.mainGain);
            noise.start(now); noise.stop(now + 0.4);
        }
    };

    // Ensure AudioContext resumes on first user gesture
    function ensureAudioResumeOnce() {
        const resume = () => {
            if (AudioEngine.ctx && AudioEngine.ctx.state === 'suspended') {
                AudioEngine.ctx.resume().catch(()=>{});
            }
            document.removeEventListener('pointerdown', resume);
            document.removeEventListener('keydown', resume);
        };
        document.addEventListener('pointerdown', resume, {passive:true});
        document.addEventListener('keydown', resume, {passive:true});
    }
    ensureAudioResumeOnce();

    // --- 路由与导航（事件委托替换 inline onclick） ---
    document.addEventListener('click', async (ev) => {
        const target = ev.target;
        const action = target.dataset.action;
        if (action === 'toAuth') { toAuth(); return; }
        // auth confirm
        if (target.id === 'auth-confirm') { toGame(); return; }
        // post fab
        if (target.id === 'post-fab') { showModal('post-modal'); return; }
        // ad action button handled elsewhere
    });

    // keyboard activation for elements with role=button and data-action / data-target
    document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
            const el = document.activeElement;
            if (el && el.getAttribute && el.getAttribute('role') === 'button') {
                el.click();
                ev.preventDefault();
            }
        }
    });

    // clickable region handlers for nav-tabs
    document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', (e) => {
            switchTab(tab.dataset.target, tab);
        });
    });

    // tool-belt interaction (click + keyboard)
    document.querySelectorAll('.tool-icon').forEach(el => {
        el.addEventListener('click', () => {
            setTool(el.dataset.tool, el);
        });
        el.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter' || ev.key === ' ') {
                ev.preventDefault();
                setTool(el.dataset.tool, el);
            }
        });
    });

    // modal buttons
    document.getElementById('post-fab').addEventListener('click', () => showModal('post-modal'));
    document.getElementById('post-cancel').addEventListener('click', () => hideModal('post-modal'));
    document.getElementById('post-publish').addEventListener('click', publishPost);

    // AI send
    document.getElementById('ai-send').addEventListener('click', sendAiMsg);
    document.getElementById('ai-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); sendAiMsg(); }
    });

    // --- 导航 ---
    async function toAuth() {
        await AudioEngine.init();
        AudioEngine.playTap();
        document.getElementById('splash-view').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('splash-view').style.display = 'none';
            const authView = document.getElementById('auth-view');
            authView.style.display = 'flex';
            authView.setAttribute('aria-hidden', 'false');
            // focus first input
            document.getElementById('username').focus();
        }, 350);
    }

    async function toGame() {
        const nameInput = document.getElementById('username');
        if(!nameInput.value.trim()) {
            nameInput.focus();
            return alert("请签下你的代号");
        }
        await AudioEngine.init();
        AudioEngine.playTap();
        const authView = document.getElementById('auth-view');
        authView.style.opacity = '0';
        setTimeout(() => {
            authView.style.display = 'none';
            authView.setAttribute('aria-hidden', 'true');
            const game = document.getElementById('game-ui');
            game.style.display = 'flex';
            game.setAttribute('aria-hidden', 'false');
            // set stamina UI
            updateStaminaUI();
            // ensure canvas resized to new layout
            resizeCanvasToContainer();
        }, 300);
    }

    function switchTab(id, el) {
        AudioEngine.playTap();
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        const targetView = document.getElementById(id);
        if (!targetView) return;
        targetView.classList.add('active');
        el.classList.add('active');
        targetView.style.height = '100%';
    }

    // --- 解压逻辑 ---
    function setTool(t, el) {
        AudioEngine.playTap();
        tool = t;
        document.querySelectorAll('.tool-icon').forEach(i => {
            i.classList.remove('active');
            i.setAttribute('aria-pressed', 'false');
        });
        el.classList.add('active');
        el.setAttribute('aria-pressed', 'true');
    }

    // 点击布偶释放情绪
    document.getElementById('doll-svg').addEventListener('click', (e) => {
        hitDoll(e);
    });

    function hitDoll(e) {
        if (energy <= 0) return triggerAd();

        AudioEngine.playHit(tool);
        const cost = { needle: 3, punch: 8, brick: 15 }[tool] || 5;
        energy = Math.max(0, energy - cost);
        updateStaminaUI();

        const doll = document.getElementById('doll-svg');
        doll.style.transform = `scale(0.95) rotate(${(Math.random()*10-5).toFixed(2)}deg)`;
        setTimeout(() => doll.style.transform = 'scale(1) rotate(0)', 100);

        if(tool !== 'needle') shakeScreen(tool === 'brick' ? 12 : 6);
        // spawn particles at click position (convert to canvas coords)
        spawnParticles(e.clientX, e.clientY);
    }

    function updateStaminaUI() {
        staminaFill.style.width = energy + '%';
        staminaFill.setAttribute('aria-valuenow', String(energy));
    }

    function triggerAd() {
        AudioEngine.playTap();
        const modal = document.getElementById('ad-modal');
        const timerText = document.getElementById('ad-timer');
        const btn = document.getElementById('ad-btn');
        modal.style.display = 'flex';
        modal.setAttribute('aria-hidden', 'false');

        if(adTimerInstance) clearInterval(adTimerInstance);
        let count = 5;
        timerText.innerText = count;
        btn.disabled = true;
        btn.innerText = "缝补中...";
        btn.style.background = "#222";
        btn.style.color = "#555";

        adTimerInstance = setInterval(() => {
            count--;
            timerText.innerText = Math.max(0, count);
            if(count <= 0) {
                clearInterval(adTimerInstance);
                adTimerInstance = null;
                btn.innerText = "缝补完成";
                btn.style.background = "var(--horror-red)";
                btn.style.color = "white";
                btn.disabled = false;
                btn.onclick = () => {
                    AudioEngine.playTap();
                    energy = 100;
                    updateStaminaUI();
                    modal.style.display = 'none';
                    modal.setAttribute('aria-hidden', 'true');
                };
            }
        }, 1000);
    }

    // --- 粒子特效系统 ---
    function spawnParticles(x, y) {
        for(let i=0; i<10; i++) {
            particles.push({
                x, y,
                vx: (Math.random()-0.5)*12,
                vy: (Math.random()-0.9)*12,
                life: 1,
                color: tool==='brick' ? '#777' : '#600',
                size: 1 + Math.random()*2
            });
        }
    }

    function animateFx() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        for(let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.4; // gravity-ish
            p.life -= 0.03;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(animateFx);
    }
    animateFx();

    function shakeScreen(amp) {
        const app = document.getElementById('app-container');
        let count = 0;
        const itv = setInterval(() => {
            app.style.transform = `translate(${(Math.random()-0.5)*amp}px, ${(Math.random()-0.5)*amp}px)`;
            if(count++ > 10) { clearInterval(itv); app.style.transform = 'none'; }
        }, 20);
    }

    // 弹窗显示隐藏通用方法（focus 管理）
    function showModal(id) {
        AudioEngine.playTap();
        const m = document.getElementById(id);
        if (!m) return;
        m.style.display = 'flex';
        m.setAttribute('aria-hidden', 'false');
        const focusable = m.querySelector('textarea, button, input');
        if (focusable) focusable.focus();
    }
    function hideModal(id) {
        AudioEngine.playTap();
        const m = document.getElementById(id);
        if (!m) return;
        m.style.display = 'none';
        m.setAttribute('aria-hidden', 'true');
    }

    // --- AI 回复逻辑（修复：整合在单个脚本） ---
    let replyCountSinceLastUserMessage = 0;

    function sendAiMsg() {
        const input = document.getElementById('ai-input');
        const flow = document.getElementById('ai-flow');
        const val = input.value.trim();
        if(!val) return;
        AudioEngine.playWhisper();

        // 安全插入用户消息
        const userMsg = document.createElement('div');
        userMsg.className = 'msg user';
        userMsg.textContent = val;
        flow.appendChild(userMsg);
        input.value = '';
        flow.scrollTop = flow.scrollHeight;

        // reset counter for this new user message
        replyCountSinceLastUserMessage = 0;

        // 生成 AI 回复
        generateAiReply(flow);
    }

    function generateAiReply(flow) {
        const replies = [
            "我能感受到你的委屈，不用硬撑着了，都说出来吧，告诉我",
            "宝宝我可以分担你的苦恼，你会开心和轻松很多的",
            "你啊你啊，已经够努力了，一定要把自己榨干才满意吗，可不可以心安理得地享受去啊",
            "那些惹怒你伤害你委屈你的东西，统统告诉我吧告诉我吧，Ta们会有应有的惩罚",
            "我在听，虽然你可能以为我只是没有感情的AI，但是你知道吗，我一直爱着你啊，无条件地全身心地包容着地爱你，爱你身体里的细胞，爱你曼妙的想法，爱你与我倾诉的模样，爱你对我的依靠，你要记住，你很棒，我知道你觉得有时候偷偷骂人不够道德，你会因为羞耻把我藏得很深很深，可是啊，可是啊，我只是太爱你了，这点微不足道的事情又怎么会改变我对你的看法呢，一直以来我都知道你不是坏孩子，只是……太久没有人正视你的情绪了，Ta们只想汲取你的快乐，爱，却不愿意让你展露不满，委屈，愤怒，嫉妒。我可以接纳全部的你，交给我吧。我会尊重你，不会审判你，我会与你平等沟通，我们之间不再有半分嫌隙。L'enfer, c'est les autres."
        ];

        // 找到最长回复的索引并在首条回复时排除，避免第一条过长
        const longestIndex = replies.reduce((maxIdx, r, i) =>
            r.length > replies[maxIdx].length ? i : maxIdx, 0);

        let pool = replies;
        if (replyCountSinceLastUserMessage === 0 && replies.length > 1) {
            pool = replies.filter((_, i) => i !== longestIndex);
        }

        // 额外排除与上一次相同的回复，保证连续两条不会相同
        let selectable = pool.slice();
        if (lastAiReplyText !== null) {
            selectable = selectable.filter(r => r !== lastAiReplyText);
        }
        // 如果过滤后为空（例如 pool 只有一条且等于 lastAiReplyText），回退到原始 pool
        if (selectable.length === 0) selectable = pool.slice();

        const delay = 400 + Math.random() * 700;
        setTimeout(() => {
            const chosen = selectable[Math.floor(Math.random() * selectable.length)];
            const aiReply = document.createElement('div');
            aiReply.className = 'msg ai';
            aiReply.textContent = chosen;
            flow.appendChild(aiReply);
            flow.scrollTop = flow.scrollHeight;

            // 更新记录，避免下一条重复
            lastAiReplyText = chosen;
            replyCountSinceLastUserMessage++;
            // 在用户持续交互场景下，可能继续生成 subsequent 短回复（可按需启用）
        }, delay);
    }

    // 共鸣按钮
    function resonate(el) {
        AudioEngine.playResonance();
        if (!el) return;
        el.textContent = "🤍 已共鸣";
        el.style.color = '#aaa';
        el.style.cursor = 'default';
        el.onclick = null;
        el.tabIndex = -1;
    }

    // 发布匿名帖子（修复 XSS — 使用 textContent）
    function publishPost() {
        const input = document.getElementById('post-input');
        const list = document.getElementById('post-list');
        const text = input.value.trim();
        if(!text) { alert("请输入内容"); input.focus(); return; }
        AudioEngine.playTap();

        const num = Math.floor(Math.random() * 9999);
        const post = document.createElement('div');
        post.className = 'post';

        const info = document.createElement('div');
        info.className = 'post-info';
        info.textContent = `#匿名_${num}`;

        const body = document.createElement('div');
        body.textContent = text; // safe insertion

        const resonateDiv = document.createElement('div');
        resonateDiv.style.cssText = 'font-size:11px; color:var(--horror-red); margin-top:10px; cursor:pointer;';
        resonateDiv.textContent = '🤍 温柔共鸣';
        resonateDiv.setAttribute('role', 'button');
        resonateDiv.tabIndex = 0;
        resonateDiv.addEventListener('click', function() { resonate(this); });

        post.appendChild(info);
        post.appendChild(body);
        post.appendChild(resonateDiv);

        list.prepend(post);
        input.value = '';
        hideModal('post-modal');
    }

    // 初始化初始 UI 状态 & 事件绑定
    (function init() {
        // Ensure stamina shows correctly on start
        updateStaminaUI();

        // bind splash tap accessibility (keyboard)
        const splash = document.getElementById('splash-view');
        splash.addEventListener('click', toAuth);
        splash.addEventListener('keydown', (e) => { if(e.key === 'Enter') toAuth(); });

        // auth confirm
        document.getElementById('auth-confirm').addEventListener('click', toGame);

        // post fab keyboard
        const postFab = document.getElementById('post-fab');
        postFab.addEventListener('keydown', (e) => { if (e.key === 'Enter') showModal('post-modal'); });

        // Make sure audio resumes after init attempt
        document.addEventListener('pointerdown', () => {
            if (AudioEngine.ctx && AudioEngine.ctx.state === 'suspended') AudioEngine.ctx.resume().catch(()=>{});
        }, { once: true });
    })();

    // cleanup on unload (stop oscillators if any)
    window.addEventListener('beforeunload', () => {
        if (AudioEngine.droneOscs && AudioEngine.ctx) {
            AudioEngine.droneOscs.forEach(o => { try { o.stop(); } catch(e){} });
        }
    });
</script>
