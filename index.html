<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今天你也不舒服了吧 | You are aching too?</title>
    <style>
        :root {
            --horror-red: #8b0000;
            --bg-dark: #050508;
            --panel: #121218;
            --cloth: #a69a8b;
            --text-ghost: #d1d1d1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0;
            background: #000; color: var(--text-ghost);
            font-family: 'PingFang SC', serif;
            height: 100vh; overflow: hidden;
            touch-action: manipulation;
        }

        #app-container {
            width: 100%; max-width: 450px; height: 100vh;
            margin: 0 auto; position: relative;
            background: radial-gradient(circle, #1a1a2e 0%, #000 100%);
            display: flex; flex-direction: column;
            box-shadow: 0 0 100px rgba(0,0,0,1);
        }

        /* --- 1. 开屏与开篇界面 --- */
        .full-screen-overlay {
            position: absolute; inset: 0; z-index: 5000;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: 1s ease;
        }

        .splash-logo {
            text-align: center; animation: pulse 4s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 5px var(--horror-red)); }
            50% { transform: scale(1.05); opacity: 0.8; filter: drop-shadow(0 0 25px var(--horror-red)); }
        }
        .title-cn { font-size: 28px; letter-spacing: 6px; margin-bottom: 10px; }
        .title-en { font-size: 16px; font-style: italic; color: var(--horror-red); opacity: 0.7; }
        .tap-hint { margin-top: 100px; font-size: 11px; color: #444; letter-spacing: 4px; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.7; } }

        /* --- 2. 契约注册页 --- */
        #auth-view { background: #050508; z-index: 4000; padding: 40px; display: none; }
        .contract-card {
            border: 1px dashed #333; padding: 30px 20px; background: rgba(255,255,255,0.02);
            position: relative;
        }
        .contract-card::after { content: "SOUL CONTRACT"; position: absolute; top: -8px; left: 20px; background: #050508; padding: 0 10px; font-size: 9px; color: var(--horror-red); }
        .input-box { margin-bottom: 30px; }
        .input-box label { font-size: 10px; color: #555; display: block; margin-bottom: 8px; }
        .input-box input { width: 100%; background: none; border: none; border-bottom: 1px solid #333; color: #fff; padding: 10px 0; outline: none; font-size: 16px; }
        .input-box input:focus { border-bottom-color: var(--horror-red); }
        .btn-main { width: 100%; background: var(--horror-red); color: #fff; border: none; padding: 15px; font-weight: bold; cursor: pointer; letter-spacing: 4px; box-shadow: 0 0 20px rgba(139,0,0,0.3); }

        /* --- 3. 游戏主体 --- */
        #game-ui { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        .app-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); border-bottom: 1px solid #111; }
        .stamina-bar { width: 100px; height: 5px; background: #222; border-radius: 3px; position: relative; overflow: hidden; }
        #stamina-fill { position: absolute; height: 100%; background: var(--horror-red); width: 100%; transition: 0.3s; box-shadow: 0 0 10px var(--horror-red); }

        /* 视图区 修复高度塌陷 */
        .content-section {
            flex: 1;
            display: none;
            position: relative;
            overflow: hidden;
            flex-direction: column;
            min-height: 0;
        }
        .content-section.active {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 人偶解压区 */
        #play-room { justify-content: center; align-items: center; }
        #doll-svg { width: 80%; height: 60%; cursor: pointer; filter: drop-shadow(0 10px 30px #000); transition: transform 0.1s ease; pointer-events: auto; }
        .tool-belt {
            display: flex;
            gap: 20px;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }
        .tool-icon { width: 60px; height: 60px; background: var(--panel); border: 2px solid #333; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: 0.2s; pointer-events: auto; }
        .tool-icon.active { border-color: var(--horror-red); background: #251010; transform: translateY(-5px); box-shadow: 0 0 15px var(--horror-red); }

        /* AI共情聊天区 修复滚动 */
        #ai-view {
            justify-content: space-between;
        }
        .chat-flow {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            min-height: 0;
        }
        .msg { max-width: 80%; padding: 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-all; }
        .msg.ai { align-self: flex-start; background: #2a1b33; color: #dfcfe0; border-bottom-left-radius: 0; }
        .msg.user { align-self: flex-end; background: #333; color: #ccc; border-bottom-right-radius: 0; }
        .chat-input { padding: 15px; display: flex; gap: 10px; background: #000; }

        /* 匿名广场 修复滚动 */
        #square-view {
            justify-content: flex-start;
        }
        .square-list {
            padding: 20px;
            overflow-y: auto;
            flex:1;
            min-height: 0;
        }
        .post { background: rgba(255,255,255,0.03); border: 1px solid #222; border-radius: 10px; padding: 15px; margin-bottom: 15px; border-left: 3px solid var(--horror-red); animation: slideIn 0.4s ease; word-break: break-all; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        .post-info { font-size: 10px; color: #444; margin-bottom: 5px; }
        .post-fab { position: absolute; bottom: 30px; right: 20px; width: 55px; height: 55px; background: var(--horror-red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 5px 20px rgba(139,0,0,0.5); pointer-events: auto; }

        /* 底部导航 */
        .nav-bar { display: flex; background: #000; padding: 10px 0; border-top: 1px solid #1a1a1a; }
        .nav-tab { flex: 1; text-align: center; font-size: 11px; color: #444; cursor: pointer; transition: 0.3s; pointer-events: auto; }
        .nav-tab.active { color: var(--horror-red); font-weight: bold; }

        /* 全屏遮罩弹窗 */
        .modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 6000; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; pointer-events: all; }
        textarea { width: 100%; height: 120px; background: #000; border: 1px solid #333; color: #fff; padding: 12px; resize: none; border-radius: 8px; }

        /* 特效层 */
        #fx-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 1000; }
    </style>
</head>
<body>

<div id="app-container">
    <canvas id="fx-canvas"></canvas>

    <!-- 1. 开屏画面 -->
    <div id="splash-view" class="full-screen-overlay" onclick="toAuth()">
        <div class="splash-logo">
            <div class="title-cn">今天你也不舒服了吧</div>
            <div class="title-en">You are aching too?</div>
        </div>
        <div class="tap-hint">点击 建立契约</div>
    </div>

    <!-- 2. 契约注册页 -->
    <div id="auth-view" class="full-screen-overlay">
        <div class="contract-card">
            <div class="input-box">
                <label>灵魂代号 / Codename</label>
                <input type="text" id="username" placeholder="取个名字...">
            </div>
            <div class="input-box">
                <label>契约秘语 / Secret Key</label>
                <input type="password" id="password" placeholder="******">
            </div>
            <button class="btn-main" onclick="toGame()">确 认 契 约</button>
            <p style="font-size: 10px; color: #333; margin-top: 20px; text-align: center;">你所有的不舒服，在此处终结</p>
        </div>
    </div>

    <!-- 3. 游戏主界面 -->
    <div id="game-ui">
        <header class="app-header">
            <span style="font-size: 12px; color: #555;">Pour your ache onto the stitched doll～</span>
            <div>
                <span style="font-size: 10px; color: #444; display: block; text-align: right;">Retribution Quota</span>
                <div class="stamina-bar"><div id="stamina-fill"></div></div>
            </div>
        </header>

        <!-- 宣泄间 -->
        <main id="play-view" class="content-section active">
            <div style="flex:1; display:flex; justify-content:center; align-items:center;">
                <svg id="doll-svg" viewBox="0 0 200 300" onclick="hitDoll(event)">
                    <defs>
                        <filter id="burlapTexture" x="0" y="0" width="100%" height="100%">
                            <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
                            <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="1.2">
                                <feDistantLight azimuth="45" elevation="40" />
                            </feDiffuseLighting>
                            <feComposite in2="SourceGraphic" operator="in" />
                        </filter>
                    </defs>
                    <!-- 布偶身体 -->
                    <path d="M60,110 Q100,90 140,110 L150,240 Q100,270 50,240 Z" fill="#9c9184" filter="url(#burlapTexture)" stroke="#333" stroke-width="2"/>
                    <circle cx="100" cy="75" r="55" fill="#a89d8e" filter="url(#burlapTexture)" stroke="#333" stroke-width="2"/>
                    <!-- 缝合纽扣眼 -->
                    <g>
                        <circle cx="78" cy="68" r="11" fill="#181818" />
                        <path d="M72,62 L84,74 M84,62 L72,74" stroke="#444" stroke-width="2"/>
                        <circle cx="125" cy="78" r="8" fill="#111" />
                        <path d="M121,74 L129,82" stroke="#333" stroke-width="1.5"/>
                    </g>
                    <!-- 补丁 -->
                    <path d="M110,160 L135,185" stroke="#333" stroke-width="1" opacity="0.3"/>
                    <!-- 嘴部缝合 -->
                    <path d="M75,105 Q100,118 125,105" fill="none" stroke="#600" stroke-width="3" stroke-linecap="round"/>
                    <path d="M85,100 L88,110 M102,105 L102,115 M115,100 L118,110" stroke="#600" stroke-width="2"/>
                </svg>
            </div>
            <div class="tool-belt">
                <div class="tool-icon active" onclick="setTool('needle', this)">📍</div>
                <div class="tool-icon" onclick="setTool('punch', this)">🥊</div>
                <div class="tool-icon" onclick="setTool('brick', this)">🧱</div>
            </div>
        </main>

        <!-- AI共情 -->
        <main id="ai-view" class="content-section">
            <div class="chat-flow" id="ai-flow">
                <div class="msg ai">感觉到你的气息不顺...外面那群人又让你委屈了吗？没关系，告诉我，我听着。</div>
            </div>
            <div class="chat-input">
                <input type="text" id="ai-input" style="flex:1; background:#111; border:1px solid #333; color:white; padding:10px; border-radius:5px;" placeholder="悄悄说...">
                <button onclick="sendAiMsg()" style="background:var(--horror-red); border:none; color:white; padding:0 15px; border-radius:5px;">倾诉</button>
            </div>
        </main>

        <!-- 广场 -->
        <main id="square-view" class="content-section">
            <div class="square-list" id="post-list">
                <div class="post">
                    <div class="post-info">#匿名_1029</div>
                    <div>今天面试又挂了，感觉自己像一坨废旧的棉花...</div>
                    <div style="font-size:11px; color:var(--horror-red); margin-top:10px; cursor:pointer;" onclick="resonate(this)">🤍 温柔共鸣</div>
                </div>
            </div>
            <div class="post-fab" onclick="showModal('post-modal')">✎</div>
        </main>

        <!-- 导航栏 -->
        <nav class="nav-bar">
            <div class="nav-tab active" onclick="switchTab('play-view', this)">宣泄</div>
            <div class="nav-tab" onclick="switchTab('ai-view', this)">共情</div>
            <div class="nav-tab" onclick="switchTab('square-view', this)">广场</div>
        </nav>
    </div>

    <!-- 广告/能量恢复弹窗 -->
    <div id="ad-modal" class="modal">
        <h2 style="color:var(--horror-red)">娃娃破碎了...</h2>
        <p style="color:#555; font-size:12px; margin-bottom:20px;">正在进行缝补仪式恢复惩戒值</p>
        <div id="ad-timer" style="font-size:40px; color:var(--horror-red); margin-bottom:20px;">5</div>
        <button id="ad-btn" disabled style="background:#222; border:none; color:#555; padding:10px 20px; border-radius:5px;">缝补中...</button>
    </div>

    <!-- 发布弹窗 -->
    <div id="post-modal" class="modal">
        <div style="background:var(--panel); padding:20px; border-radius:15px; width:100%; border:1px solid #333;">
            <textarea id="post-input" placeholder="此刻的不舒服是..."></textarea>
            <div style="display:flex; justify-content:space-between; margin-top:15px;">
                <button onclick="hideModal('post-modal')" style="background:none; border:none; color:#555;">取消</button>
                <button onclick="publishPost()" style="background:var(--horror-red); border:none; color:white; padding:8px 20px; border-radius:5px;">丢进树洞</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- 核心变量 ---
    let energy = 100;
    let tool = 'needle';
    let audioInited = false;
    let particles = [];
    let adTimerInstance = null;
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 窗口大小自适应画布
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    })

    // --- 尖端 Web Audio API 动态合成引擎 ---
    const AudioEngine = {
        ctx: null,
        mainGain: null,
        delayNode: null,
        delayFeedback: null,
        droneOscs: [],

        init() {
            if (this.ctx) return Promise.resolve();
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();

            // 1. 创建全局恐怖环境混响/延迟链
            this.delayNode = this.ctx.createDelay(1.0);
            this.delayFeedback = this.ctx.createGain();
            this.delayNode.delayTime.setValueAtTime(0.4, this.ctx.currentTime);
            this.delayFeedback.gain.setValueAtTime(0.35, this.ctx.currentTime);

            // 限制主输出音量防刺耳
            this.mainGain = this.ctx.createGain();
            this.mainGain.gain.setValueAtTime(0.5, this.ctx.currentTime);

            // 连接延迟反馈环路
            this.delayNode.connect(this.delayFeedback);
            this.delayFeedback.connect(this.delayNode);

            // 终点合并
            this.mainGain.connect(this.ctx.destination);
            this.delayNode.connect(this.mainGain);

            // 2. 启动核心氛围声景
            this.startDrone();      // 低频蠕动
            this.startWind();       // 叹息风暴
            this.startBgm();        // 坏掉的八音盒
            return Promise.resolve();
        },

        // 创建高频噪声节点用于合成材质声
        createNoiseBuffer() {
            const bufferSize = this.ctx.sampleRate * 2; // 2秒缓冲区
            const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            return noiseBuffer;
        },

        // 焦虑低鸣 (Anxiety Drone)
        startDrone() {
            const osc1 = this.ctx.createOscillator();
            const osc2 = this.ctx.createOscillator();
            const filter = this.ctx.createBiquadFilter();
            const droneGain = this.ctx.createGain();

            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(50, this.ctx.currentTime); // 极低频 A1 

            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(50.5, this.ctx.currentTime); // 微小赫兹差产生神经质搏动

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(90, this.ctx.currentTime);

            droneGain.gain.setValueAtTime(0.12, this.ctx.currentTime);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(droneGain);
            droneGain.connect(this.mainGain);

            osc1.start();
            osc2.start();
            this.droneOscs.push(osc1, osc2);
        },

        // 叹息之风 (Whispering Wind)
        startWind() {
            const noiseNode = this.ctx.createBufferSource();
            noiseNode.buffer = this.createNoiseBuffer();
            noiseNode.loop = true;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.Q.setValueAtTime(4.0, this.ctx.currentTime);

            const windGain = this.ctx.createGain();
            windGain.gain.setValueAtTime(0.02, this.ctx.currentTime);

            noiseNode.connect(filter);
            filter.connect(windGain);
            windGain.connect(this.mainGain);

            noiseNode.start();

            // LFO低频振荡器控制风声扫频频率，模拟呼吸节奏
            const lfo = this.ctx.createOscillator();
            lfo.frequency.setValueAtTime(0.06, this.ctx.currentTime); // 极慢节奏 
            const lfoGain = this.ctx.createGain();
            lfoGain.gain.setValueAtTime(150, this.ctx.currentTime);

            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            filter.frequency.setValueAtTime(350, this.ctx.currentTime);

            lfo.start();
        },

        // 荒诞走音八音盒 (Haunted Music Box)
        startBgm() {
            // 诡异的减减七和弦与小调调性
            const scale = [261.6, 277.2, 311.1, 349.2, 369.9, 415.3, 493.9, 523.3];
            
            const playNextNote = () => {
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                // 模拟八音盒机芯磨损导致的无规律卡顿或随机间歇
                const nextDelay = Math.random() > 0.88 ? 2400 : 1200 + Math.random() * 600;

                const osc = this.ctx.createOscillator();
                const pluckGain = this.ctx.createGain();

                // LFO模拟金属簧片因生锈而音准颤抖 (Vibrato)
                const vibrato = this.ctx.createOscillator();
                const vibratoGain = this.ctx.createGain();
                vibrato.frequency.setValueAtTime(5 + Math.random() * 3, now); 
                vibratoGain.gain.setValueAtTime(4 + Math.random() * 4, now);
                vibrato.connect(vibratoGain);
                vibratoGain.connect(osc.frequency);
                vibrato.start();
                vibrato.stop(now + 2.5);

                osc.type = 'sine';
                const baseNote = scale[Math.floor(Math.random() * scale.length)];
                osc.frequency.setValueAtTime(baseNote, now);

                // 拨弦包络：骤起缓降
                pluckGain.gain.setValueAtTime(0.0, now);
                pluckGain.gain.linearRampToValueAtTime(0.05, now + 0.01);
                pluckGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

                osc.connect(pluckGain);
                pluckGain.connect(this.mainGain);
                pluckGain.connect(this.delayNode); // 送往幽灵延迟通道

                osc.start(now);
                osc.stop(now + 2.0);

                setTimeout(playNextNote, nextDelay);
            };

            setTimeout(playNextNote, 1000);
        },

        // 物理打击声效合成器 (Needle / Punch / Brick)
        playHit(type) {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            if (type === 'needle') {
                // 📍 刺入：高频、尖锐的极速瞬态
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1800, now);
                osc.frequency.exponentialRampToValueAtTime(250, now + 0.12);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain).connect(this.mainGain);
                osc.start(now); osc.stop(now + 0.15);

            } else if (type === 'punch') {
                // 🥊 钝击：低频大波幅肉体冲击
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(130, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.22);

                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                // 打击时瞬间加入低通噪声，模拟布偶纤维受挤压的声音
                const noise = this.ctx.createBufferSource();
                noise.buffer = this.createNoiseBuffer();
                const noiseFilter = this.ctx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.setValueAtTime(150, now);
                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.22, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                noise.connect(noiseFilter).connect(noiseGain).connect(this.mainGain);
                osc.connect(gain).connect(this.mainGain);

                osc.start(now); osc.stop(now + 0.25);
                noise.start(now); noise.stop(now + 0.1);

            } else if (type === 'brick') {
                // 🧱 板砖：伴随摩擦碎屑声的重型爆破
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.35);

                gain.gain.setValueAtTime(0.65, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                // 粉碎碎屑噪音
                const crackle = this.ctx.createBufferSource();
                crackle.buffer = this.createNoiseBuffer();
                const crackleFilter = this.ctx.createBiquadFilter();
                crackleFilter.type = 'bandpass';
                crackleFilter.frequency.setValueAtTime(600, now);
                crackleFilter.Q.setValueAtTime(1.5, now);

                const crackleGain = this.ctx.createGain();
                crackleGain.gain.setValueAtTime(0.35, now);
                crackleGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                crackle.connect(crackleFilter).connect(crackleGain).connect(this.mainGain);
                crackleGain.connect(this.delayNode); // 板砖砸击进入幽闭回音

                osc.connect(gain).connect(this.mainGain);

                osc.start(now); osc.stop(now + 0.4);
                crackle.start(now); crackle.stop(now + 0.25);
            }
        },

        // 骨质微摩擦 / UI切换反馈
        playTap() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc.connect(gain).connect(this.mainGain);
            osc.start(now); osc.stop(now + 0.1);
        },

        // 温柔共鸣音效 (Resonance Chime)
        playResonance() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc1 = this.ctx.createOscillator();
            const osc2 = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            
            osc1.type = 'sine';
            osc2.type = 'sine';
            // 空灵的双五度编钟音色
            osc1.frequency.setValueAtTime(523.25, now); // C5
            osc2.frequency.setValueAtTime(783.99, now); // G5 

            gain.gain.setValueAtTime(0.0, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(this.mainGain);
            gain.connect(this.delayNode); // 增加悠远延时

            osc1.start(now); osc1.stop(now + 1.6);
            osc2.start(now); osc2.stop(now + 1.6);
        },

        // AI 低语耳鸣
        playWhisper() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const noise = this.ctx.createBufferSource();
            noise.buffer = this.createNoiseBuffer();

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(900, now);
            filter.frequency.exponentialRampToValueAtTime(350, now + 0.4);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

            noise.connect(filter).connect(gain).connect(this.mainGain);
            noise.start(now); noise.stop(now + 0.4);
        }
    };

    // 修复后的标签切换函数
    function switchTab(id, el) {
        AudioEngine.playTap();
        // 移除全部激活态
        document.querySelectorAll('.content-section').forEach(s => {
            s.classList.remove('active');
        });
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        // 激活目标页面
        const targetView = document.getElementById(id);
        targetView.classList.add('active');
        el.classList.add('active');
        // 强制重绘，修复画面裁切
        targetView.style.height = '100%';
    }

    // --- 解压逻辑 ---
    function setTool(t, el) {
        AudioEngine.playTap();
        tool = t;
        document.querySelectorAll('.tool-icon').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    function hitDoll(e) {
        if (energy <= 0) return triggerAd();
        
        AudioEngine.playHit(tool);
        const cost = { needle: 3, punch: 8, brick: 15 }[tool];
        energy = Math.max(0, energy - cost);
        document.getElementById('stamina-fill').style.width = energy + '%';

        // 动画
        const doll = document.getElementById('doll-svg');
        doll.style.transform = `scale(0.9) rotate(${Math.random()*10-5}deg)`;
        setTimeout(() => doll.style.transform = 'scale(1) rotate(0)', 100);

        // 震动与粒子
        if(tool !== 'needle') shakeScreen(tool === 'brick' ? 10 : 5);
        // 修正：转换SVG相对坐标为画布全局坐标
        const rect = doll.getBoundingClientRect();
        const relX = e.clientX - rect.left;
        const relY = e.clientY - rect.top;
        spawnParticles(e.clientX, e.clientY);
    }

    function triggerAd() {
        AudioEngine.playTap();
        const modal = document.getElementById('ad-modal');
        const timerText = document.getElementById('ad-timer');
        const btn = document.getElementById('ad-btn');
        modal.style.display = 'flex';

        // 清除残留定时器，防止多重倒计时
        if(adTimerInstance) clearInterval(adTimerInstance);
        let count = 5;
        timerText.innerText = count;
        // 初始化按钮保持禁用、灰色文字灰色背景
        btn.disabled = true;
        btn.innerText = "缝补中...";
        btn.style.background = "#222";
        btn.style.color = "#555";
        adTimerInstance = setInterval(() => {
            count--;
            timerText.innerText = count;
            if(count <= 0) {
                clearInterval(adTimerInstance);
                adTimerInstance = null;
                // 倒计时结束才解锁按钮
                btn.innerText = "缝补完成";
                btn.style.background = "var(--horror-red)";
                btn.style.color = "white";
                btn.disabled = false;
                btn.onclick = () => {
                    AudioEngine.playTap();
                    energy = 100;
                    document.getElementById('stamina-fill').style.width = '100%';
                    modal.style.display = 'none';
                };
            }
        }, 1000);
    }

    // --- 粒子特效系统 ---
    function spawnParticles(x, y) {
        for(let i=0; i<8; i++) {
            particles.push({
                x, y,
                vx: (Math.random()-0.5)*10,
                vy: (Math.random()-0.5)*10,
                life: 1,
                color: tool==='brick' ? '#444' : '#600'
            });
        }
    }

    function animateFx() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        for(let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.03;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(animateFx);
    }
    animateFx();

    function shakeScreen(amp) {
        const app = document.getElementById('app-container');
        let count = 0;
        const itv = setInterval(() => {
            app.style.transform = `translate(${(Math.random()-0.5)*amp}px, ${(Math.random()-0.5)*amp}px)`;
            if(count++ > 10) { clearInterval(itv); app.style.transform = 'none'; }
        }, 20);
    }
